<div class="login-container" style="max-width: 400px; margin: 100px auto; padding: 20px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
  <h2 style="text-align: center; color: #2c3e50;">BusyNuts Login</h2>
  
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    
    <div style="margin-bottom: 15px;">
      <label for="username" style="display: block; margin-bottom: 5px;">Username</label>
      <input type="text" id="username" name="username" [(ngModel)]="credentials.username" required 
             style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required 
             style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px; text-align: center;">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="!loginForm.valid" 
            style="width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Login
    </button>

  </form>
</div>
