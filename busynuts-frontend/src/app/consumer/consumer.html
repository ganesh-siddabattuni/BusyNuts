<div style="font-family: sans-serif; background-color: #f9f9f9; min-height: 100vh;">

  <div
    style="background-color: #27ae60; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center;">
    <h2 style="margin: 0;">🥜 BusyNuts</h2>

    <div
      style="cursor: pointer; font-weight: bold; background-color: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px;">
      🛒 Cart ({{ cartService.cartCount() }})
    </div>
  </div>

  <div style="padding: 30px; max-width: 1200px; margin: 0 auto;">
    <h1 style="color: #333; text-align: center; margin-bottom: 30px;">Our High-Protein Snacks</h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">

      @for (product of products(); track product.id) {
      <div
        style="background-color: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column;">
        <h3 style="margin-top: 0; color: #2c3e50;">{{ product.name }}</h3>
        <p style="color: #7f8c8d; font-size: 14px; flex-grow: 1;">{{ product.description }}</p>
        <h2 style="color: #27ae60; margin: 15px 0;">₹{{ product.price }}</h2>

        <button (click)="onAddToCart(product)"
          style="width: 100%; padding: 10px; background-color: #f39c12; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
          Add to Cart
        </button>
      </div>
      } @empty {
      <div style="text-align: center; grid-column: 1 / -1; color: #7f8c8d;">
        <h3>Loading products...</h3>
      </div>
      }

    </div>
  </div>
</div>
